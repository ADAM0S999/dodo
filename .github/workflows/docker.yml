name: Docker Build & Validation

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'index.js'
      - 'config.js'
      - 'lib/**'
      - 'plugins/**'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'index.js'
      - 'config.js'
      - 'lib/**'
      - 'plugins/**'
  workflow_dispatch:

jobs:
  docker-build:
    name: 🐳 Build Docker Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🤖 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: adam-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Validation status
        run: |
          echo "🎉 Docker image built and validated successfully!"
