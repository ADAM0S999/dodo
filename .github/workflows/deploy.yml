name: Deploy ADAM Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ❤️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 📥 Install dependencies
        run: npm ci --omit=dev

      - name: 🏗️ Build the project
        run: npm run build || exit 0

      - name: 📋 Display project structure
        run: |
          echo "📁 Project structure:"
          find . -type f -not -path '*/node_modules/*' | sort

      - name: 📊 Show commit info
        run: |
          echo "🚀 Deploying commit: $(git rev-parse --short HEAD)"
          echo "🌿 Branch: $GITHUB_REF_NAME"

      - name: 🎨 Color scheme check
        run: |
          echo "🎨 Checking Dark Red/Crimson theme files..."
          grep -r "red-600\|red-500\|red-400" --include="*.js" --include="*.html" --include="*.md" . | wc -l
          echo "✅ Theme files validated"

      - name: 📦 Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: adam-bot-build
          path: |
            index.html
            pages/session.js
            pages/api/index.js
            lib/db/session.js
            README.md
          retention-days: 7