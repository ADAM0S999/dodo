name: Test ADAM Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly test on Sunday at 02:00 UTC

jobs:
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🤖 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 📥 Install dependencies
        run: npm ci --omit=dev

      - name: 🏗️ Run unit tests
        run: npm test || echo "No test file found, skipping..."

      - name: 📊 Show test results
        run: |
          echo "🧪 Unit tests completed for commit $(git rev-parse --short HEAD)"
          echo "📋 Branch: $GITHUB_REF_NAME"

  - name: 🔍 Run linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🤖 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 📥 Install dependencies
        run: npm ci --omit=dev

      - name: 🔍 Run eslint
        run: npm run lint || echo "No eslint config, skipping..."

      - name: 📊 Show lint results
        run: |
          echo "🔍 Linting completed for commit $(git rev-parse --short HEAD)"

  # Type check job
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🤖 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 📥 Install dependencies
        run: npm ci --omit=dev

      - name: 🏗️ Run type check
        run: npm run type-check || echo "No type check config, skipping..."

      - name: 📊 Show type check results
        run: |
          echo "🏗️ Type check completed for commit $(git rev-parse --short HEAD)"