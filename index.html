<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🤖 ADAM | WhatsApp Bot Dashboard, Session & Plugins</title>
  <meta name="description" content="ADAM — The high-performance WhatsApp bot platform. Generate your pairing code in seconds, configure environment variables, browse plugins, and deploy in one click." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🤖</text></svg>" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    let customSessionActive = false;
    let receiveWAActive = false;
    let currentSessionId = '';
    let currentPairCode = '';
    let statusPollInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      checkRecentSession();
    });

    function checkRecentSession() {
      try {
        const saved = localStorage.getItem('adam_recent_session');
        if (saved) {
          const rec = JSON.parse(saved);
          if (rec && rec.sessionId) {
            document.getElementById('recent-session-id-text').innerText = rec.sessionId;
            document.getElementById('recent-scanned-time').innerText = 'Scanned on ' + (rec.scannedAtText || 'Recently');
            document.getElementById('view-recent-session').classList.remove('hidden');
            document.getElementById('view-link-device').classList.add('hidden');
            currentSessionId = rec.sessionId;
            if (document.getElementById('cfg-session')) {
              document.getElementById('cfg-session').value = rec.sessionId;
              updateEnvPreview();
            }
            return;
          }
        }
      } catch (e) {}

      document.getElementById('view-recent-session').classList.add('hidden');
      document.getElementById('view-link-device').classList.remove('hidden');
    }

    function clearRecentSession() {
      try {
        localStorage.removeItem('adam_recent_session');
      } catch (e) {}
      document.getElementById('view-recent-session').classList.add('hidden');
      document.getElementById('view-link-device').classList.remove('hidden');
    }

    function openPairModal() {
      document.getElementById('pair-step-phone').classList.remove('hidden');
      document.getElementById('pair-step-display').classList.add('hidden');
      document.getElementById('modal-pair').classList.remove('hidden');
    }

    function closePairModal() {
      stopStatusPolling();
      document.getElementById('modal-pair').classList.add('hidden');
    }

    function changePhoneNumber() {
      stopStatusPolling();
      document.getElementById('pair-step-display').classList.add('hidden');
      document.getElementById('pair-step-phone').classList.remove('hidden');
    }

    function openQrModal() {
      const sid = getSessionId();
      document.getElementById('qr-session-preview').innerText = sid;
      document.getElementById('qr-image').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=ADAM_BOT_SESSION_' + sid;
      document.getElementById('modal-qr').classList.remove('hidden');
    }

    function closeQrModal() {
      document.getElementById('modal-qr').classList.add('hidden');
    }

    function toggleCustomSession() {
      customSessionActive = !customSessionActive;
      const chk = document.getElementById('chk-custom-session');
      const box = document.getElementById('custom-session-box');
      if (customSessionActive) {
        chk.innerHTML = '<span class="text-white text-xs font-bold">✓</span>';
        chk.className = 'w-5 h-5 rounded bg-red-600 border border-red-500 flex items-center justify-center transition';
        box.classList.remove('hidden');
      } else {
        chk.innerHTML = '';
        chk.className = 'w-5 h-5 rounded border border-zinc-700 bg-[#1c1c24] flex items-center justify-center transition';
        box.classList.add('hidden');
      }
    }

    function updateSessionPreview() {
      const val = document.getElementById('session-name-input').value.trim().replace(/[^a-zA-Z0-9_-]/g, '').toLowerCase() || 'ALMANIOS';
      document.getElementById('session-preview').innerText = 'lm7bos_' + val;
    }

    function toggleReceiveWA() {
      receiveWAActive = !receiveWAActive;
      const chk = document.getElementById('chk-receive-wa');
      if (receiveWAActive) {
        chk.innerHTML = '<span class="text-white text-xs font-bold">✓</span>';
        chk.className = 'w-5 h-5 rounded bg-red-600 border border-red-500 flex items-center justify-center transition';
      } else {
        chk.innerHTML = '';
        chk.className = 'w-5 h-5 rounded border border-zinc-700 bg-[#1c1c24] flex items-center justify-center transition';
      }
    }

    function getSessionId() {
      if (customSessionActive) {
        const inputVal = document.getElementById('session-name-input').value.trim().replace(/[^a-zA-Z0-9_-]/g, '').toLowerCase();
        if (inputVal) return 'lm7bos_' + inputVal;
      }
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let rand = '';
      for (let i = 0; i < 10; i++) rand += chars[Math.floor(Math.random() * chars.length)];
      return 'lm7bos_adjacency' + rand;
    }

    function stopStatusPolling() {
      if (statusPollInterval) {
        clearInterval(statusPollInterval);
        statusPollInterval = null;
      }
    }

    function startStatusPolling(targetSid) {
      stopStatusPolling();
      let count = 0;
      statusPollInterval = setInterval(async () => {
        count++;
        try {
          const res = await fetch('/api/pair-status?sessionId=' + encodeURIComponent(targetSid));
          if (res.ok) {
            const data = await res.json();
            if (data.status === 'CONNECTED') {
              finalizeRecentSession(targetSid);
              return;
            }
          }
        } catch (e) {}

        if (count >= 35) {
          finalizeRecentSession(targetSid);
        }
      }, 2000);
    }

    function finalizeRecentSession(sid = null) {
      stopStatusPolling();
      const finalSid = sid || currentSessionId || getSessionId();
      const now = new Date();
      const formatted = new Intl.DateTimeFormat('en-GB', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(now);

      const record = {
        sessionId: finalSid,
        scannedAt: Date.now(),
        scannedAtText: formatted
      };

      try {
        localStorage.setItem('adam_recent_session', JSON.stringify(record));
      } catch (e) {}

      document.getElementById('connection-status-text').innerText = 'CONNECTED. FINALIZING...';
      
      setTimeout(() => {
        closePairModal();
        checkRecentSession();
      }, 2000);
    }

    async function requestPairingCode() {
      const input = document.getElementById('phone-input');
      const number = input.value.trim().replace(/[^0-9]/g, '');

      if (!number || number.length < 9) {
        alert('Please enter a valid phone number with country code (e.g. 212612345678)');
        return;
      }

      const btn = document.getElementById('pair-btn');
      const spinner = document.getElementById('btn-spinner');
      const text = document.getElementById('btn-text');
      const errBox = document.getElementById('pair-error');
      const targetSessionId = getSessionId();

      btn.disabled = true;
      spinner.classList.remove('hidden');
      text.innerText = 'Connecting… (3-5s)';
      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            number,
            sessionId: targetSessionId,
            sessionName: customSessionActive ? document.getElementById('session-name-input').value.trim() : null
          })
        });

        const data = await res.json();
        btn.disabled = false;
        spinner.classList.add('hidden');
        text.innerText = 'Get Pairing Code';

        if (data.ok && data.code) {
          const finalSid = data.sessionId || targetSessionId;
          currentSessionId = finalSid;
          currentPairCode = data.code;

          // Format code with wide spaces (e.g. "L 3 V A N T E R" or "P L 7 V X P G 2")
          const cleanCode = String(data.code).replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
          const spacedCode = cleanCode.split('').join(' ');
          document.getElementById('code-letters-display').innerText = spacedCode;

          // Show Screenshot 1 view inside modal
          document.getElementById('pair-step-phone').classList.add('hidden');
          document.getElementById('pair-step-display').classList.remove('hidden');
          document.getElementById('connection-status-text').innerText = 'CONNECTED. FINALIZING...';

          startStatusPolling(finalSid);
        } else {
          errBox.innerText = data.error || 'Failed to request code. Please verify your number.';
          errBox.classList.remove('hidden');
        }
      } catch (e) {
        btn.disabled = false;
        spinner.classList.add('hidden');
        text.innerText = 'Get Pairing Code';
        errBox.innerText = 'Connection error: ' + e.message + '. If connection fails, try using a VPN.';
        errBox.classList.remove('hidden');
      }
    }

    function copyCode() {
      const clean = currentPairCode.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      navigator.clipboard.writeText(clean);
      document.getElementById('copy-btn-label').innerText = '✓ Copied';
      setTimeout(() => {
        document.getElementById('copy-btn-label').innerText = 'Copy';
      }, 2000);
    }

    function copyRecentSession() {
      const sid = document.getElementById('recent-session-id-text').innerText.trim();
      navigator.clipboard.writeText(sid);
      alert('Copied Session ID: ' + sid);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('text-white', 'bg-red-950', 'border-red-800'));
      
      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.remove('hidden');

      document.querySelectorAll('[data-tab="' + tabId + '"]').forEach(btn => {
        btn.classList.add('text-white');
      });
    }

    function updateEnvPreview() {
      const session = currentSessionId || 'lm7bos_adam';
      const prefix = document.getElementById('cfg-prefix')?.value.trim() || '.';
      const lang = document.getElementById('cfg-lang')?.value || 'en';
      const pack = document.getElementById('cfg-pack')?.value.trim() || '🤖,ADAM';
      const sudo = document.getElementById('cfg-sudo')?.value.trim() || '';
      const gemini = document.getElementById('cfg-gemini')?.value.trim() || '';
      const db = document.getElementById('cfg-db')?.value.trim() || '';

      const content = `# ── ADAM WhatsApp Bot Environment Config ──
SESSION_ID="${session}"
PREFIX="${prefix}"
BOT_LANG="${lang}"
STICKER_PACKNAME="${pack}"
SUDO="${sudo}"
VPS="true"
AUTO_UPDATE="true"
WARN_LIMIT="3"
ALWAYS_ONLINE="false"
DATABASE_URL="${db}"
GEMINI_API_KEY="${gemini}"
GEMINI_MODEL="gemini-1.5-flash"
GROQ_MODEL="llama3-70b-8192"
API_MODE="false"`;

      const preview = document.getElementById('env-preview');
      if (preview) preview.innerText = content;
    }

    function downloadEnv() {
      updateEnvPreview();
      const content = document.getElementById('env-preview')?.innerText || '';
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'config.env';
      a.click();
    }
  </script>
</body>
</html>
